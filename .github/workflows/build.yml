name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip -i https://pypi.tuna.tsinghua.edu.cn/simple
          python -m pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple
          python -m pip install "pyinstaller>=5.0,<6.0" -i https://pypi.tuna.tsinghua.edu.cn/simple
          python -m pip show pyinstaller | Select-String "Version"

      - name: PyInstaller 打包
        run: |
          python -m PyInstaller `
            --onefile `
            --console `
            --clean `
            --noconfirm `
            --name netease_downloader `
            --hidden-import Crypto.Cipher.AES `
            --hidden-import Crypto.Util.Padding `
            --hidden-import mutagen.id3 `
            --hidden-import mutagen.mp3 `
            netease_downloader.py

      - name: 检查产物
        run: Get-Item .\dist\netease_downloader.exe | Select-Object Name, Length

      - name: 上传 EXE
        uses: actions/upload-artifact@v4
        with:
          name: netease_downloader-win-x64
          path: dist/netease_downloader.exe
          if-no-files-found: error
          retention-days: 30

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.0
          name: 网易云音乐下载器 v2.0.0
          body: |
            ## 全新重写版（纯 Python，无需 ffmpeg）

            - 直接下载网易云原生 MP3（最高 320kbps），不再依赖 ffmpeg
            - exe 体积从 125MB 降到约 15MB，双击即用，秒起
            - 用 mutagen 写入封面与标题/歌手/专辑元数据
            - 支持：单曲 / 搜索 / 歌手 / 歌单 / 榜单 / 每日推荐
            - U 盘便携：配置与下载目录跟随 exe

            ## 使用
            直接下载下方的 `netease_downloader.exe`，双击打开即可（无参数进入菜单）。
          files: dist/netease_downloader.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
