name: Build Windows EXE

# push 到 main 或手动点 Run workflow 都会触发
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      - name: 升级 pip 并安装依赖
        run: |
          python -m pip install --upgrade pip -i https://pypi.tuna.tsinghua.edu.cn/simple
          python -m pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple

      # Actions 美国机房访问 gyan.dev / GitHub 都很快，直接手动下载 ffmpeg
      # 放到项目根目录，build_exe.py 检测到就会跳过自动下载
      - name: 下载 ffmpeg (BtbN GitHub Release)
        run: |
          curl -L -o ffmpeg.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          powershell -Command "Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp -Force"
          copy ffmpeg_tmp\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe .\ffmpeg.exe
          rmdir /s /q ffmpeg_tmp
          del ffmpeg.zip
        shell: cmd

      - name: PyInstaller 打包
        run: python build_exe.py

      - name: 检查产物
        run: dir dist
        shell: cmd

      - name: 上传 EXE 为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netease_music_downloader-win-x64
          path: dist/netease_music_downloader.exe
          if-no-files-found: error
          retention-days: 30
