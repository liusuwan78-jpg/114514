name: Build Windows EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.8
        uses: actions/setup-python@v5
        with:
          python-version: "3.8"

      # 装依赖 + PyInstaller 5.x（Win7 兼容）
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip -i https://pypi.tuna.tsinghua.edu.cn/simple
          python -m pip install -r requirements.txt -i https://pypi.tuna.tsinghua.edu.cn/simple --upgrade
          python -m pip install "pyinstaller>=5.0,<6.0" -i https://pypi.tuna.tsinghua.edu.cn/simple --force-reinstall
          python --version
          python -m pip show pyinstaller | Select-String "Version"

      # Actions 机房直连 GitHub Release 很快（~225MB/s），下载 ffmpeg 放项目根目录
      - name: 下载 ffmpeg
        run: |
          $ProgressPreference = 'SilentlyContinue'
          Write-Host "Downloading ffmpeg..."
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Write-Host "Extracting ffmpeg..."
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg_tmp -Force
          Copy-Item ffmpeg_tmp\ffmpeg-master-latest-win64-gpl\bin\ffmpeg.exe .\ffmpeg.exe
          Remove-Item -Recurse -Force ffmpeg_tmp, ffmpeg.zip
          Write-Host "ffmpeg.exe ready:"
          Get-Item .\ffmpeg.exe | Select-Object Name, Length

      # 直接跑 PyInstaller，绕过 build_exe.py 的复杂逻辑
      - name: PyInstaller 打包
        run: |
          python -m PyInstaller `
            --onefile `
            --console `
            --clean `
            --noconfirm `
            --name netease_music_downloader `
            --add-binary "ffmpeg.exe;." `
            --hidden-import Crypto.Cipher.AES `
            --hidden-import Crypto.Util.Padding `
            --hidden-import Crypto.Util.strxor `
            --hidden-import Crypto.Random `
            --hidden-import mutagen `
            --hidden-import mutagen.id3 `
            --hidden-import mutagen.mp3 `
            netease_music_downloader.py

      - name: 检查产物
        run: |
          Get-Item .\dist\netease_music_downloader.exe | Select-Object Name, Length, LastWriteTime

      - name: 上传 EXE 为 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: netease_music_downloader-win-x64
          path: dist/netease_music_downloader.exe
          if-no-files-found: error
          retention-days: 30
