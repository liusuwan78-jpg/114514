name: Build Windows XP EXE

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # XP 上能运行的最后一代 Python 3 是 3.4.4，且必须是 32 位
      - name: 安装 Python 3.4.4（32 位）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.4.4/python-3.4.4.msi" -OutFile "$env:RUNNER_TEMP\python344.msi" -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i", "$env:RUNNER_TEMP\python344.msi", "/qn", "ALLUSERS=1", "TARGETDIR=C:\Python34", "/norestart" -Wait
          if (-not (Test-Path "C:\Python34\python.exe")) { throw "Python 3.4.4 安装失败" }
          & C:\Python34\python.exe -V
          if (-not (Test-Path "C:\Python34\Scripts\pip.exe")) {
            & C:\Python34\python.exe -m ensurepip
          }

      - name: 安装依赖
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/pip/3.4/get-pip.py" -OutFile "get-pip.py" -UseBasicParsing
          & C:\Python34\python.exe get-pip.py
          if ($LASTEXITCODE -ne 0) { throw "get-pip 失败" }
          & C:\Python34\python.exe -m pip install --no-cache-dir "setuptools==40.8.0" "wheel==0.33.6"
          if ($LASTEXITCODE -ne 0) { throw "setuptools 安装失败" }
          & C:\Python34\python.exe -m pip install --no-cache-dir -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "requirements 安装失败" }
          & C:\Python34\python.exe -m pip install --no-cache-dir "altgraph==0.16.1" "pefile==2018.8.8" "pywin32-ctypes==0.1.2" "pyinstaller==3.4"
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller 安装失败" }
          & C:\Python34\python.exe -c "import requests, Crypto.Cipher.AES, PyInstaller; print(requests.__version__, Crypto.__version__, PyInstaller.__version__)"

      - name: 下载最新 HTTPS 根证书
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://curl.se/ca/cacert.pem" -OutFile "cacert.pem" -UseBasicParsing

      - name: PyInstaller 打包
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pyiArgs = @(
            "--onefile", "--console", "--clean", "--noconfirm",
            "--name", "netease_downloader",
            "--add-data", "cacert.pem;.",
            "--hidden-import", "Crypto.Cipher.AES",
            "--hidden-import", "Crypto.Cipher._raw_aes",
            "--hidden-import", "Crypto.Cipher._raw_aesni",
            "--hidden-import", "Crypto.Util._raw_api",
            "netease_downloader.py"
          )
          # XP 上没有 msvcr100.dll，必须随 exe 一起打包
          if (Test-Path "C:\Python34\msvcr100.dll") {
            $pyiArgs = @("--add-binary", "C:\Python34\msvcr100.dll;.") + $pyiArgs
          }
          & C:\Python34\python.exe -m PyInstaller @pyiArgs
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller 打包失败" }
          if (-not (Test-Path ".\dist\netease_downloader.exe")) { throw "未生成 exe" }
          Select-String -Path .\build\netease_downloader\*.toc -Pattern "msvcr100" -SimpleMatch

      - name: 检查产物
        shell: pwsh
        run: |
          Get-Item .\dist\netease_downloader.exe | Select-Object Name, Length
          & .\dist\netease_downloader.exe --version
          if ($LASTEXITCODE -ne 0) { throw "exe 启动失败" }

      - name: 联网实测（搜索 + 下载）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # 验证 exe 内打包的 requests / AES / RSA 能正常访问网易云
          & .\dist\netease_downloader.exe --search 青花瓷 --limit 1 -o .\ci_music
          if ($LASTEXITCODE -ne 0) { throw "exe 联网测试失败" }
          # GitHub 机房在境外，网易云通常不给境外 IP 播放地址；拿到文件才做进一步校验
          if (Test-Path .\ci_music\*.mp3) {
            Get-ChildItem .\ci_music | Select-Object Name, Length
          } else {
            Write-Warning "当前 runner 地区拿不到播放链接，跳过下载校验（国内网络可正常下载）"
          }

      - name: 上传 EXE
        uses: actions/upload-artifact@v4
        with:
          name: netease_downloader-win-xp
          path: dist/netease_downloader.exe
          if-no-files-found: error
          retention-days: 30

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: 网易云音乐下载器 v3.0.0（XP 兼容版）
          body: |
            ## Windows XP 兼容版

            - **32 位单文件 exe**，Windows XP SP3 / Win7 / Win8 / Win10 / Win11 均可直接运行
            - 使用 Python 3.4.4（XP 支持的最后一代 Python 3）
            - 纯 Python，无需安装 Python、无需 ffmpeg
            - 直接下载网易云原生 MP3（最高 320kbps），手工写入标题 / 歌手 / 专辑 / 封面
            - 支持：单曲 / 搜索 / 歌手 / 歌单 / 榜单 / 每日推荐
            - 配置与下载目录跟随 exe，U 盘便携

            ## 使用
            下载下方的 `netease_downloader.exe`，双击打开，按菜单操作即可。
            若杀毒软件误报，添加信任即可（PyInstaller 打包程序的常见误报）。
          files: dist/netease_downloader.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
