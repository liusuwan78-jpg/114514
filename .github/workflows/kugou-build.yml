name: Build Kugou EXE (XP)

on:
  push:
    branches: [main]
    paths:
      - "kugou/**"
      - ".github/workflows/kugou-build.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    env:
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: "1"

    defaults:
      run:
        working-directory: kugou

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # XP 上能运行的最后一代 Python 3 是 3.4.4，且必须是 32 位
      - name: 安装 Python 3.4.4（32 位）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://www.python.org/ftp/python/3.4.4/python-3.4.4.msi" -OutFile "$env:RUNNER_TEMP\python344.msi" -UseBasicParsing
          Start-Process msiexec.exe -ArgumentList "/i", "$env:RUNNER_TEMP\python344.msi", "/qn", "ALLUSERS=1", "TARGETDIR=C:\Python34", "/norestart" -Wait
          if (-not (Test-Path "C:\Python34\python.exe")) { throw "Python 3.4.4 安装失败" }
          & C:\Python34\python.exe -V

      - name: 安装依赖
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://bootstrap.pypa.io/pip/3.4/get-pip.py" -OutFile "$env:RUNNER_TEMP\get-pip.py" -UseBasicParsing
          & C:\Python34\python.exe "$env:RUNNER_TEMP\get-pip.py"
          if ($LASTEXITCODE -ne 0) { throw "get-pip 失败" }
          & C:\Python34\python.exe -m pip install --no-cache-dir "setuptools==40.8.0" "wheel==0.33.6"
          if ($LASTEXITCODE -ne 0) { throw "setuptools 安装失败" }
          & C:\Python34\python.exe -m pip install --no-cache-dir -r requirements.txt
          if ($LASTEXITCODE -ne 0) { throw "requirements 安装失败" }
          & C:\Python34\python.exe -m pip install --no-cache-dir "altgraph==0.16.1" "pefile==2018.8.8" "pywin32-ctypes==0.1.2" "pyinstaller==3.4"
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller 安装失败" }
          & C:\Python34\python.exe -c "import requests, PyInstaller; print(requests.__version__, PyInstaller.__version__)"

      - name: 下载最新 HTTPS 根证书
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Invoke-WebRequest -Uri "https://curl.se/ca/cacert.pem" -OutFile "cacert.pem" -UseBasicParsing

      - name: PyInstaller 打包
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pyiArgs = @(
            "--onefile", "--console", "--clean", "--noconfirm",
            "--name", "kugou_downloader",
            "--add-data", "cacert.pem;.",
            "kugou_downloader.py"
          )
          # XP 上没有 msvcr100.dll，必须随 exe 一起打包
          if (Test-Path "C:\Python34\msvcr100.dll") {
            $pyiArgs = @("--add-binary", "C:\Python34\msvcr100.dll;.") + $pyiArgs
          }
          & C:\Python34\python.exe -m PyInstaller @pyiArgs
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller 打包失败" }
          if (-not (Test-Path ".\dist\kugou_downloader.exe")) { throw "未生成 exe" }

      - name: 检查产物
        shell: pwsh
        run: |
          Get-Item .\dist\kugou_downloader.exe | Select-Object Name, Length
          & .\dist\kugou_downloader.exe --version
          if ($LASTEXITCODE -ne 0) { throw "exe 启动失败" }
          & .\dist\kugou_downloader.exe --list-ranks
          if ($LASTEXITCODE -ne 0) { throw "榜单接口不可用" }

      - name: Python 3.4 兼容性自测（ID3 / 签名 / 歌词解码）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          @'
          import base64
          import kugou_downloader as k

          open("selftest.mp3", "wb").write(b"ID3\x03\x00\x00\x00\x00\x00\x00" + b"FAKE" * 2000)
          ok = k.write_tags("selftest.mp3", "Test", "Artist", "Album", b"\x89PNG" + b"X" * 100)
          assert ok
          data = open("selftest.mp3", "rb").read()
          assert data[:3] == b"ID3"
          assert k.build_filename("a" * 500, "b" * 500) == ("a" * 500 + " - " + "b" * 500)[:110]
          assert k._norm_name(" 青花瓷 (Live) ") == "青花瓷live"
          assert k.parse_song_input("") is None
          assert base64.b64encode(b"abc").decode("ascii") == "YWJj"
          print("selftest OK file=%d" % len(data))
          '@ | Set-Content -Encoding UTF8 selftest.py
          & C:\Python34\python.exe selftest.py
          if ($LASTEXITCODE -ne 0) { throw "Python 3.4 自测失败" }

      - name: 联网实测（搜索）
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & .\dist\kugou_downloader.exe --search 邓丽君 --limit 1 -o .\ci_music
          if ($LASTEXITCODE -ne 0) { throw "exe 联网测试失败" }
          # 境外机房可能拿不到播放地址，只能下到文件才校验
          if (Get-ChildItem .\ci_music\*.mp3 -ErrorAction SilentlyContinue) {
            Get-ChildItem .\ci_music | Select-Object Name, Length
          } else {
            Write-Warning "当前 runner 地区拿不到播放链接，跳过下载校验（国内网络可正常下载）"
          }

      - name: 上传 EXE
        uses: actions/upload-artifact@v4
        with:
          name: kugou_downloader-win-xp
          path: kugou/dist/kugou_downloader.exe
          if-no-files-found: error
          retention-days: 30

      - name: 发布到 Release
        if: startsWith(github.ref, 'refs/heads/main')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kugou-v1.0.0
          name: 酷狗音乐下载器 v1.0.0（XP 兼容版）
          body: |
            ## Windows XP 兼容版

            - **32 位单文件 exe**，Windows XP SP3 / Win7 / Win8 / Win10 / Win11 均可直接运行
            - 使用 Python 3.4.4（XP 支持的最后一代 Python 3）
            - 纯 Python + requests，无需 flac / ffmpeg
            - 音质自动降级：优先 320k / FLAC，拿不到回到 128k
            - 自动保存同名 `.lrc` 歌词，按歌名 + 歌手匹配避免串词
            - 手工写入标题 / 歌手 / 专辑 / 封面
            - 支持：单曲 / 搜索 / 榜单

            ## 使用
            下载下方的 `kugou_downloader.exe`，双击打开，按菜单操作即可。
            若杀毒软件误报，添加信任即可（PyInstaller 打包程序的常见误报）。
          files: kugou/dist/kugou_downloader.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
